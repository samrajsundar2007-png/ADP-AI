server {
    listen 80;
    server_name localhost;

    # Maximum file ingestion limit matching back-end parameters
    client_max_body_size 50M;

    # 1. Route API traffic straight to your running Uvicorn server instance
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support headers (if needed later for chat streaming streams)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Route root locations straight to your compiled production static frontend assets
    location / {
        root /path/to/your/ADP-AI/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
